<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collectie pagina</title>
    <link rel="stylesheet" href="../css/collection.css">
    <script defer src="../js/collection.js"></script>
    <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon">
</head>
<body>
    <header>
        <div class="top-bar">
            <button class="side-btn"></button>  <!-- Linker knop -->
            <div class="profile-icon">
                <img src="/images/login.png" alt="Profiel">
            </div>    <!-- Gecentreerd profielicoon -->
            <button class="side-btn"></button>  <!-- Rechter knop -->
        </div>
    </header>
    
    
    
    <main>
        <div class="gallery">
            <img src="../images/kaarten/Maanvis.png" alt="Afbeelding 1">
            <img src="../images/kaarten/Groene Zeeschildpad.png" alt="Afbeelding 2">
            <img src="../images/kaarten/Spookhaai.png" alt="Afbeelding 3">
        
            <div class="holo-card">
                <img src="../images/kaarten/Europese Zeekat.png" alt="Afbeelding 4">
            </div>
            <div class="holo-card">
                <img src="../images/kaarten/Noordse Weerhaai.png" alt="Afbeelding 5">
            </div>
            <div class="holo-card">
                <img src="../images/kaarten/Atlantische Blauwe Vinvis.png" alt="Afbeelding 6">
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn home"></button>
        <button class="nav-btn gallery active"></button>
        <button class="nav-btn refresh"></button>
        <button class="nav-btn profile"></button>
    </nav>
</body>
</html>
