<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DeepDive Packs">
    <title>Login - DeepDive Packs</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <link rel="stylesheet" href="css/auth-forms.css">
    <link rel="stylesheet" href="css/form-validation.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <main class="form-container">
        <div class="ocean-backdrop">
            <div class="bubbles-bg"></div>
            <div class="light-rays"></div>
        </div>

        <section class="form-content">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <div class="form-header">
                <div class="form-logo">
                    <div class="logo-glow"></div>
                    <i class="fas fa-water"></i>
                </div>
                <h1 class="form-title">Login</h1>
                <p class="form-subtitle">Welcome back, deep sea explorer!</p>
            </div>

            <form class="login-form" action="#" method="POST">
                <div class="form-group">
                    <label for="email"><i class="fas fa-user"></i> Username or Email</label>
                    <input type="text" id="email" name="email" required placeholder="Enter your username or email">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">
                    <span class="btn-content">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    </span>
                </button>

                <p class="form-footer">
                    Don't have an account? <a href="register.html" class="text-link">Register here</a>
                </p>
            </form>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
