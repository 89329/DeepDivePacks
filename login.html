<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to DeepDive Packs">
    <title>Login - DeepDive Packs</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <link rel="stylesheet" href="css/auth-forms.css">
    <link rel="stylesheet" href="css/popup.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="form-container">
        <section class="form-content">
            <a href="index.html" class="back-link">&larr; Back to Home</a>
            <h1 class="form-title">Login</h1>
            <form class="login-form" action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-btn">Login</button>
                <p class="form-footer">
                    Don't have an account? <a href="register.html" class="text-link">Register here</a>
                </p>
            </form>
        </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
