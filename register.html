<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for DeepDive Packs">
    <title>Register - DeepDive Packs</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <link rel="stylesheet" href="css/auth-forms.css">
    <link rel="stylesheet" href="css/form-validation.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <main class="form-container">
        <div class="ocean-backdrop">
            <div class="bubbles-bg"></div>
            <div class="light-rays"></div>
        </div>

        <section class="form-content">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <div class="form-header">
                <div class="form-logo">
                    <div class="logo-glow"></div>
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="form-title">Create Account</h1>
                <p class="form-subtitle">Join the underwater adventure!</p>
            </div>

            <form class="register-form" action="#" method="POST">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username"
                        minlength="3" maxlength="30">
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password"
                        minlength="8">
                </div>

                <div class="form-group">
                    <label for="confirm-password"><i class="fas fa-key"></i> Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required
                        placeholder="Confirm your password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" id="terms" required>
                        <span>I agree to the <a href="#" class="text-link">Terms & Conditions</a></span>
                    </label>
                </div>

                <button type="submit" class="auth-btn">
                    <span class="btn-content">
                        <i class="fas fa-user-plus"></i>
                        <span>Create Account</span>
                    </span>
                </button>

                <p class="form-footer">
                    Already have an account? <a href="login.html" class="text-link">Login here</a>
                </p>
            </form>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
