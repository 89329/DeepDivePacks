<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for DeepDive Packs">
    <title>Register - DeepDive Packs</title>
    <link rel="stylesheet" href="css/main-layout.css">
    <link rel="stylesheet" href="css/auth-forms.css">
    <link rel="stylesheet" href="css/popup.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="form-container">
        <section class="form-content">
            <a href="index.html" class="back-link">&larr; Back to Home</a>
            <h1 class="form-title">Create Account</h1>
            <form class="register-form" action="#" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username"
                        minlength="3" maxlength="30">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password"
                        minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required
                        placeholder="Confirm your password">
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" id="terms" required>
                        <span>I agree to the Terms & Conditions</span>
                    </label>
                </div>
                <button type="submit" class="auth-btn">Create Account</button>
                <p class="form-footer">
                    Already have an account? <a href="login.html" class="text-link">Login here</a>
                </p>
            </form>
        </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
